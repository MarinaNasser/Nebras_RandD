# =========================================================
# Polyp segmentation config: SegNet (VGG-19 encoder, pretrained)
# Multi-dataset pooled stratified train / val / test split
# =========================================================

# ---- Dataset paths ----
datasets:
  CVC-ClinicDB:
    images_dir: "C:/Users/Omen Max/Datasets/CVC-ClinicDB/TIF/Original"
    masks_dir: "C:/Users/Omen Max/Datasets/CVC-ClinicDB/TIF/Ground Truth"
    img_ext: ".tif"
    mask_ext: ".tif"

  CVC-ColonDB:
    images_dir: "C:/Users/Omen Max/Datasets/CVC-ColonDB/images"
    masks_dir: "C:/Users/Omen Max/Datasets/CVC-ColonDB/masks"
    img_ext: ".png"
    mask_ext: ".png"

  ETIS-LaribPolypDB:
    images_dir: "C:/Users/Omen Max/Datasets/ETIS-LaribPolypDB/images"
    masks_dir: "C:/Users/Omen Max/Datasets/ETIS-LaribPolypDB/masks"
    img_ext: ".png"
    mask_ext: ".png"

  Kvasir-SEG:
    images_dir: "C:/Users/Omen Max/Datasets/kvasir/segmented-images/images"
    masks_dir: "C:/Users/Omen Max/Datasets/kvasir/segmented-images/masks"
    img_ext: ".jpg"
    mask_ext: ".jpg"

# ---- Split Ratios (applied per dataset) ----
train_fraction: 0.70
val_fraction: 0.10
test_fraction: 0.20

# ---- Model ----
encoder: "vgg19_bn"
model_variant: "segformer"
freeze_encoder_epochs: 5
segformer_size: "b3" 
in_channels: 3
num_classes: 1

# ---- Training ----
image_size: 512
batch_size: 4
epochs: 60
lr: 1.0e-4
lr_finetune: 1.0e-5
weight_decay: 1.0e-5
num_workers: 4
seed: 42
early_stopping_patience: 12
use_amp: true
resume: true
save_every_n_steps: 50

# ---- Output ----
checkpoint_dir: "checkpoints"
output_dir: "outputs"